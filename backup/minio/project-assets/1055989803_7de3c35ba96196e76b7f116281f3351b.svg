<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="216.86186" height="263.72651" viewBox="0,0,216.86186,263.72651"><g transform="translate(-131.73574,-46.44767)"><g stroke="none" stroke-miterlimit="10"><path d="M131.73574,310.17418v-260.70571h216.86186v260.70571z" fill="#4b7d7a" stroke-width="NaN"/><text transform="translate(135.10001,78.51667) scale(0.73835,0.73835)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sell PC:</tspan></text><text transform="translate(135.89466,117.90183) scale(0.33679,0.33679)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Reccomended Price:</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Your Price:</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Rating Of Price: </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Estemated Time: </tspan></text><text transform="translate(137.175,125.76545) scale(0.15354,0.15354)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">This depends on the components in the computer</tspan></text><text transform="translate(136.68892,158.52141) scale(0.15354,0.15354)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">The more you increase this price, the more people wont want to buy</tspan><tspan x="0" dy="46.150000000000006px">your computer. You can see that rating below.</tspan></text><text transform="translate(136.17251,204.72859) scale(0.15354,0.15354)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">This is the rating on how much people what to buy your PC out of 10</tspan><tspan x="0" dy="46.150000000000006px">depending on your price. If its lower that means people will not want</tspan><tspan x="0" dy="46.150000000000006px">to buy it making it take longer for it to sell.</tspan></text></g></g></svg>
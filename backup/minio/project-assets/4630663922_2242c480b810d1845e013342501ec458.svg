<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="501.5015" height="359.92793" viewBox="0,0,501.5015,359.92793"><g transform="translate(-1.24925,0.96396)"><g stroke="none" stroke-miterlimit="10"><path d="M1.24925,358.96397v-359.92793h501.5015v359.92793z" fill="#ffffff" stroke-width="NaN"/><text transform="translate(112.4264,40.75885) scale(0.67335,0.67335)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">SPELL GUIDE</tspan></text><text transform="translate(6.452,316.04468) scale(0.33364,0.33364)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">*Some bosses or minibosses may not </tspan><tspan x="0" dy="46.150000000000006px">have a visible health bar</tspan></text><text transform="translate(20.36636,350.33939) scale(0.27923,0.27923)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">*click to close, space for next slide</tspan></text><text transform="translate(30.74925,68.14819) scale(0.31545,0.31545)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">FIREBALLS: Press F to unleash</tspan><tspan x="0" dy="46.15px">a flaming meteor and crush</tspan><tspan x="0" dy="46.15px">your enemies. (innefective to </tspan><tspan x="0" dy="46.15px">flying, 5 mana)</tspan></text><text transform="translate(30.9324,141.51824) scale(0.30313,0.30313)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Cannonballs: Press E (when </tspan><tspan x="0" dy="46.15px">you've unlocked the cannon) to </tspan><tspan x="0" dy="46.15px">fire a cannonball and hit almost</tspan><tspan x="0" dy="46.15px">all types of enemies.(innefective to </tspan><tspan x="0" dy="46.15px">frostborne, 2 mana) </tspan></text><text transform="translate(15.74925,236.84602) scale(0.42212,0.42212)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">OTHER SPELLS: </tspan><tspan x="0" dy="46.15px">When you pick an upgrade, </tspan><tspan x="0" dy="46.15px">READ FIRST!!!!!</tspan></text></g></g></svg>
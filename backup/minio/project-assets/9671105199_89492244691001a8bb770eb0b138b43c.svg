<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="367.5" height="341.025" viewBox="0,0,367.5,341.025"><g transform="translate(19.5,-22)"><g stroke-miterlimit="10"><path d="M-13.5,363.025c-3.31371,0 -6,-2.68629 -6,-6v-5.5c0,-3.31371 2.68629,-6 6,-6h28c3.31371,0 6,2.68629 6,6v5.5c0,3.31371 -2.68629,6 -6,6z" fill-opacity="0.15294" fill="#000000" stroke="#ff5700" stroke-width="0"/><path d="M139.25,336.75c-3.31371,0 -6,-2.68629 -6,-6v-301.5c0,-3.31371 2.68629,-6 6,-6h201.5c3.31371,0 6,2.68629 6,6v301.5c0,3.31371 -2.68629,6 -6,6z" fill="#383838" stroke="#4a4a4a" stroke-width="2.5"/><text transform="translate(141.04583,46.42433) scale(0.42486,0.42486)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Update 1.8 (Sun Update)</tspan></text><text transform="translate(139,68.17713) scale(0.27327,0.27327)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Additions:</tspan><tspan x="0" dy="46.150000000000006px">- Add the sun and all of its upgrades</tspan><tspan x="0" dy="46.150000000000006px">- Add more tips to the menu</tspan><tspan x="0" dy="46.150000000000006px">- Change the High Score keeper to a</tspan><tspan x="0" dy="46.150000000000006px">built in one</tspan><tspan x="0" dy="46.150000000000006px">- Brand new save and load UI, you can</tspan><tspan x="0" dy="46.150000000000006px">now save data to your browser</tspan><tspan x="0" dy="46.150000000000006px">Fixes:</tspan><tspan x="0" dy="46.150000000000006px">- Fix the left and right arrows being</tspan><tspan x="0" dy="46.150000000000006px">buggy</tspan><tspan x="0" dy="46.150000000000006px">- Fix the Prestige Multipler not showing</tspan><tspan x="0" dy="46.150000000000006px">up half of the time</tspan><tspan x="0" dy="46.150000000000006px">- Fix the prices being dimmed if you</tspan><tspan x="0" dy="46.150000000000006px">cant buy them being broken</tspan><tspan x="0" dy="46.150000000000006px">- General bug fixing</tspan><tspan x="0" dy="46.150000000000006px">Removals:</tspan><tspan x="0" dy="46.150000000000006px">- The heat death of the universe</tspan></text><text transform="translate(148.58677,299.025) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Thanks for playing!</tspan></text></g></g></svg>
x="0" dy="46.150000000000006px">This attack had no effect.</tspan><tspan x="0" dy="46.150000000000006px">The flameballs will be formed with a single strike.</tspan><tspan x="0" dy="46.150000000000006px">The enemy has this symbol.</tspan><tspan x="0" dy="46.150000000000006px">They have it.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text><text transform="translate(133.13264,141.12669) scale(0.21675,0.21675)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">World - Winged/flying enemies</tspan><tspan x="0" dy="46.150000000000006px">Trick to avoid falling to the ground</tspan><tspan x="0" dy="46.150000000000006px">Use arrows/bullets.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text><g fill="#000000" fill-rule="evenodd" stroke-linecap="butt"><path d="M40.20842,150.66281c0,0 2.58973,-19.07568 23.69804,-24.03409c21.10831,-4.9578 47.36804,0.2103 62.0056,5.3784l-18.90951,4.68506c0,0 4.08349,2.31079 10.55416,1.36544c-0.33269,0.04438 -1.31925,3.27731 -12.31318,5.23115c0,0 2.32447,0.88239 6.34509,-0.12609c0,0 -4.64885,4.47485 -16.45946,6.68079l4.14628,0.81935c0,0 -25.38017,4.4118 -37.19079,12.85721" stroke="none" stroke-width="1"/><path d="M40.20842,150.66281c0,0 2.58973,-19.07568 23.69804,-24.03409c21.10831,-4.9578 47.36804,0.2103 62.0056,5.3784l-18.90951,4.68506c0,0 4.08349,2.31079 10.55416,1.36544c-0.33269,0.04438 -1.31925,3.27731 -12.31318,5.23115c0,0 2.32447,0.88239 6.34509,-0.12609c0,0 -4.64885,4.47485 -16.45946,6.68079l4.14628,0.81935c0,0 -25.38017,4.4118 -37.19079,12.85721" stroke="#5f6484" stroke-width="0.5"/></g><text transform="translate(130.30555,188.55379) scale(0.19792,0.19792)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Arcade" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Shirebourne - They want to send them to </tspan><tspan x="0" dy="46.150000000000006px">other countries. Usually, one or two things</tspan><tspan x="0" dy="46.150000000000006px">happen in each world.If you hurt them,</tspan><tspan x="0" dy="46.150000000000006px">Teleport directly to the end of the line,</tspan><tspan x="0" dy="46.150000000000006px">See you later. I use free magic.</tspan><tspan x="0" dy="46.150000000000006px">For weight loss. Note: Stillbirth is</tspan><tspan x="0" dy="46.150000000000006px">also possible. Fly.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text><path d="M72.10481,210.10326c0,-5.88989 4.90491,-10.66457 10.95544,-10.66457c6.05052,0 10.95544,4.77469 10.95544,10.66457c0,5.88989 -4.90491,10.66457 -10.95544,10.66457c-6.05052,0 -10.95544,-4.77469 -10.95544,-10.66457zM83.06024,196.72792c-1.40609,0 -2.54596,-1.22777 -2.54596,-2.74232v-11.93917c0,-1.51455 1.13987,-2.74232 2.54596,-2.74232v0c1.40609,0 2.54596,1.22777 2.54596,2.74232v11.93917c0,1.51455 -1.13987,2.74232 -2.54596,2.74232zM83.06024,223.46539c1.40609,0 2.54596,1.22777 2.54596,2.74232v11.93917c0,1.51451 -1.13987,2.74232 -2.54596,2.74232v0c-1.40609,0 -2.54596,-1.2278 -2.54596,-2.74232v-11.93917c0,-1.51455 1.13987,-2.74232 2.54596,-2.74232zM69.32693,210.09664c0,1.3688 -1.26126,2.47841 -2.81712,2.47841h-12.26479c-1.55586,0 -2.81712,-1.10961 -2.81712,-2.47841v0c0,-1.36876 1.26126,-2.47838 2.81712,-2.47838h12.26479c1.55586,0 2.81712,1.10961 2.81712,2.47838zM96.79356,210.09664c0,-1.36876 1.26129,-2.47838 2.81712,-2.47838h12.26479c1.55586,0 2.81712,1.10961 2.81712,2.47838v0c0,1.3688 -1.26126,2.47841 -2.81712,2.47841h-12.26479c-1.55582,0 -2.81712,-1.10961 -2.81712,-2.47841zM73.3493,200.64356c-0.99427,0.96786 -2.69211,0.8843 -3.79226,-0.18665l-8.67252,-8.44227c-1.10015,-1.07094 -1.18601,-2.72371 -0.19174,-3.69161v0c0.99427,-0.96786 2.69214,-0.8843 3.79229,0.18665l8.67252,8.44227c1.10015,1.07094 1.18597,2.72371 0.1917,3.69161zM92.77118,219.54974c0.99427,-0.96786 2.69211,-0.88433 3.7922
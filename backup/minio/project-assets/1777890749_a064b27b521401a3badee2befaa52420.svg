<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="405.67802" height="271.39988" viewBox="0,0,405.67802,271.39988"><g transform="translate(-117.16099,-43.27808)"><g stroke-miterlimit="10"><path d="M122.86175,313.67796c-2.59616,0 -4.70076,-2.1046 -4.70076,-4.70076v-257.95437c0,-2.59616 2.1046,-4.70076 4.70076,-4.70076h394.2765c2.59616,0 4.70076,2.1046 4.70076,4.70076v257.95437c0,2.59616 -2.1046,4.70076 -4.70076,4.70076z" fill="#737373" stroke="#000000" stroke-width="2"/><text transform="translate(121.80486,78.13811) scale(0.80138,0.80138)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Warning!!</tspan></text><text transform="translate(121.26091,101.27099) scale(0.31517,0.31517)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">This OS (project) Only works on Chromium</tspan><tspan x="0" dy="46.150000000000006px">baised Browsers!! due to some of the games</tspan><tspan x="0" dy="46.150000000000006px">and apps i use using Cursor lock and keyboard</tspan><tspan x="0" dy="46.150000000000006px">capture which does not work on firefox and </tspan><tspan x="0" dy="46.150000000000006px">non chromium baised browsers.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Chromium browsers: Google Chrome, brave,</tspan><tspan x="0" dy="46.150000000000006px">any Opera browser,  Vivaldi, Microsoft Edge, </tspan><tspan x="0" dy="46.150000000000006px">Ungoogled chrome, Chromium. (just google</tspan><tspan x="0" dy="46.150000000000006px">your browser and if its chromium baised)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Warning on the Gemini AI Chatbot: I have limited tokens on</tspan><tspan x="0" dy="46.150000000000006px">how much you can use that, so dont send it too much stuff</tspan><tspan x="0" dy="46.150000000000006px">or else no one can use the AI Chatbot! (also dont steal my api </tspan><tspan x="0" dy="46.150000000000006px">key its using the free plan theres no point)</tspan></text></g></g></svg>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="457.49658" height="336.30441" viewBox="0,0,457.49658,336.30441"><g transform="translate(-11.45248,-6.9284)"><g stroke-miterlimit="10"><text transform="translate(26.75552,35.06289) scale(0.64677,0.64677)" font-size="40" xml:space="preserve" fill="#6e00ff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">ArkIDE Almost ended... Heres why.</tspan></text><text transform="translate(240,73.76791) scale(0.40153,0.40153)" font-size="40" xml:space="preserve" fill="#6e00ff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="400" text-anchor="middle"><tspan x="0" dy="0">Git deleted half of my work on the ArkIDE editor, making</tspan><tspan x="0" dy="46.15px">the editor completly nonfunctional for more than an hour,</tspan><tspan x="0" dy="46.15px">And rightfuly so i was freaking out, but guess what, i had to</tspan><tspan x="0" dy="46.15px">run 2 commands to fix it, revert that commit i did, and rein-</tspan><tspan x="0" dy="46.15px">-stall packages, and now the editor works fine, and even</tspan><tspan x="0" dy="46.15px">the paint editor has all of the new fixes and changes i did!</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">thank you git for being a piece of garbage.</tspan></text><path d="M233.9988,260.14103l-18.01668,-4.43487l-2.77179,-5.82077l4.98923,-7.48385l6.65231,-1.10872z" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M265.60133,299.6801l-6.7711,-4.0389l2.37582,-2.7322l4.27649,3.92012z" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M249.84223,235.75693l3.94981,-11.84943l7.69173,-3.11827l10.39424,1.03942l15.17558,6.44443l7.06808,8.52327l0.20788,7.48385l-13.92828,30.55905l7.06808,4.15769l-5.61289,3.53404l2.04653,29.29517l-16.21501,-10.39424l-10.6
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="393.5" height="341.025" viewBox="0,0,393.5,341.025"><g transform="translate(19.5,-22)"><g stroke-miterlimit="10"><path d="M-13.5,363.025c-3.31371,0 -6,-2.68629 -6,-6v-5.5c0,-3.31371 2.68629,-6 6,-6h28c3.31371,0 6,2.68629 6,6v5.5c0,3.31371 -2.68629,6 -6,6z" fill-opacity="0.15294" fill="#000000" stroke="#ff5700" stroke-width="0"/><path d="M114.71136,336.75c-4.1208,0 -7.46136,-2.68629 -7.46136,-6v-301.5c0,-3.31371 3.34056,-6 7.46136,-6h250.57728c4.1208,0 7.46136,2.68629 7.46136,6v301.5c0,3.31371 -3.34056,6 -7.46136,6z" fill="#383838" stroke="#4a4a4a" stroke-width="2.5"/><text transform="translate(158.67098,46.42433) scale(0.42486,0.42486)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Update 2.0 (Wowza)</tspan></text><text transform="translate(113.39654,60.59639) scale(0.24205,0.24205)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Additions:</tspan><tspan x="0" dy="46.150000000000006px">- Achievement system with buttons and an entire</tspan><tspan x="0" dy="46.150000000000006px">new menu for it</tspan><tspan x="0" dy="46.150000000000006px">- A bunch of new code for said achevments to</tspan><tspan x="0" dy="46.150000000000006px">work properly (12)</tspan><tspan x="0" dy="46.150000000000006px">- A tutorial has been added to teach new users</tspan><tspan x="0" dy="46.150000000000006px">how to play the game</tspan><tspan x="0" dy="46.150000000000006px">- New  menu that lets you start a new game or</tspan><tspan x="0" dy="46.150000000000006px">load an exsisting save</tspan><tspan x="0" dy="46.150000000000006px">- Add new tips</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Fixes:</tspan><tspan x="0" dy="46.150000000000006px">- Update the side buttons to match the rest of</tspan><tspan x="0" dy="46.150000000000006px">the UI</tspan><tspan x="0" dy="46.150000000000006px">- Fix some issues with the menu and other things</tspan><tspan x="0" dy="46.150000000000006px">menu related</tspan><tspan x="0" dy="46.150000000000006px">- Some fixes to make the game run better on</tspan><tspan x="0" dy="46.150000000000006px">low-end hardware </tspan><tspan x="0" dy="46.150000000000006px">- Make prestiging even harder</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Removals:</tspan><tspan x="0" dy="46.150000000000006px">- The heat death of the universe</tspan></text><text transform="translate(148.58677,321.025) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Thanks for playing!</tspan></text><text transform="translate(154.12952,330.00395) scale(0.16398,0.16398)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Note: Send me feedback via the send feedback button</tspan></text></g></g></svg>
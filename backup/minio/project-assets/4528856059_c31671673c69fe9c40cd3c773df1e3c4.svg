single enemy/boss in the </tspan><tspan x="0" dy="46.150000000000006px">game at 200. It has 6 different attacks, </tspan><tspan x="0" dy="46.150000000000006px">and when attacking, is still</tspan><tspan x="0" dy="46.150000000000006px">1: Boss will shoot a large laser </tspan><tspan x="0" dy="46.150000000000006px">2: Boss will dash forward</tspan><tspan x="0" dy="46.150000000000006px">3 Boss can spawn 3 enemies </tspan><tspan x="0" dy="46.150000000000006px">4: boss can spawn 2 exploding enemies </tspan><tspan x="0" dy="46.150000000000006px">5: Boss will shoot blades</tspan><tspan x="0" dy="46.150000000000006px">6: Boss will make a projectile that stuns the player</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text></g></g></svg>
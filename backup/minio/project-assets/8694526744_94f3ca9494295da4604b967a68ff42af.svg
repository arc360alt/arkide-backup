<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="448.42191" height="120.02222" viewBox="0,0,448.42191,120.02222"><g transform="translate(-19.44443,-33.57291)"><g fill="#9966ff" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-weight="400" font-size="40"><text transform="translate(19.69443,54.93402) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#9966ff"><tspan x="0" dy="0">If your not seeing your screen here,</tspan><tspan x="0" dy="46.150000000000006px">you may have closed out of the prompt</tspan><tspan x="0" dy="46.150000000000006px">to select your screen, or you may have pressed</tspan><tspan x="0" dy="46.150000000000006px">"Deny" on one of the popups. Restart the </tspan><tspan x="0" dy="46.150000000000006px">project to fix most of these issues.</tspan></text></g></g></svg>
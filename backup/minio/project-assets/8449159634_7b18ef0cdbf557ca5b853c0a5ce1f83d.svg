<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="389" height="269.15741" viewBox="0,0,389,269.15741"><g transform="translate(-125.5,-43.59259)"><g stroke="none" stroke-miterlimit="10"><path d="M125.5,312.75v-265.5h389v265.5z" fill-opacity="0.82745" fill="#4d4d4d" stroke-width="0"/><text transform="translate(128.5,80.7964) scale(0.85526,0.85526)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Controls (click to close)</tspan></text><text transform="translate(133.75,101.96791) scale(0.36184,0.36184)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">1-4: Choose the shape to spawn</tspan><tspan x="0" dy="46.150000000000006px">q &amp; e: Rotate the hovered over object</tspan><tspan x="0" dy="46.150000000000006px">c: while in color mode, colors hovered over object</tspan><tspan x="0" dy="46.150000000000006px">d: deletes hovered over object</tspan><tspan x="0" dy="46.150000000000006px">k: spins hovered over opject at a force of 500</tspan><tspan x="0" dy="46.150000000000006px">f: sets the hovered over objects rotation to 90</tspan><tspan x="0" dy="46.150000000000006px">p: pushes the object to your set force and direction</tspan><tspan x="0" dy="46.150000000000006px">s: changes the size of the object to your set size</tspan><tspan x="0" dy="46.150000000000006px">both of the above controls can be set if you click the ...</tspan><tspan x="0" dy="46.150000000000006px">button and you can set them there.</tspan><tspan x="0" dy="46.150000000000006px">space: pause and play the simulation</tspan><tspan x="0" dy="46.150000000000006px">r: rotates the hovered over object to 4 set directions</tspan></text></g></g></svg>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="463.43381" height="341.13613" viewBox="0,0,463.43381,341.13613"><g transform="translate(-7.96126,-8.01665)"><g stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-size="40"><text transform="translate(19,27.4133) scale(0.44934,0.44934)" font-size="40" xml:space="preserve" fill="#000000" text-anchor="start"><tspan x="0" dy="0">Apparently, most of you guys just do not</tspan><tspan x="0" dy="46.15px">understand what is happeing with ArkIDE.</tspan><tspan x="0" dy="46.15px">So heres a more simple list for all the people who</tspan><tspan x="0" dy="46.15px">didnt read the original post.</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">- No new big featre drops will be happening, only</tspan><tspan x="0" dy="46.15px">small bug fixes and security updates</tspan><tspan x="0" dy="46.15px">- Downtime may increase during this peroid because</tspan><tspan x="0" dy="46.15px">of my absence of upkeeping the server software</tspan><tspan x="0" dy="46.15px">- ArkIDE Will continue to be online for now untill it</tspan><tspan x="0" dy="46.15px">becomes compleatly dead</tspan><tspan x="0" dy="46.15px">- You can continue using the platform as normal</tspan><tspan x="0" dy="46.15px">without any worry of security risks</tspan></text><text transform="translate(239.10778,317.52541) scale(0.53926,0.53926)" font-size="40" xml:space="preserve" fill="#ff0000" text-anchor="middle"><tspan x="0" dy="0">So it is YOUR job to keep posting to keep this</tspan><tspan x="0" dy="46.15px">stupid platform alive.</tspan></text><text transform="translate(-84,179.16666) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ff0000" text-anchor="start"><tspan x="0" dy="0"> </tspan></text></g></g></svg>